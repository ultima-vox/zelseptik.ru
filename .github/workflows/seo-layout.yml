name: Fix SEO layout and footer phone on isolated dev
on:
  push:
    branches: [chore/seo-dev-2026-10-06]
    paths: [.github/workflows/seo-layout.yml]
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate main HostCMS template syntax
        run: php -l templates/template1/template.htm
      - name: Deploy reviewed XSL and CSS with encrypted backup and drift guard
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
        run: python3 scripts/deploy-dev-seo-layout.py

