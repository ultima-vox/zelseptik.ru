name: Deploy dev UI
on:
  push:
    branches:
      - chore/deploy-information-ui-2026-10-06
    paths:
      - .github/workflows/deploy-dev-ui.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect current hashes or deploy the fixed UI stage
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - deploy
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out reviewed UI stage
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: b9ad69831bd609d0c2370075a47c138a1bcf035a
          path: ui-source
          persist-credentials: false
      - name: Test backup and rollback behavior
        run: python3 scripts/test-deploy-dev-ui.py
      - name: Inspect or deploy with verified encrypted backup
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
          DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
        run: python3 scripts/deploy-dev-ui.py --source ui-source --mode "$DEPLOY_MODE"
