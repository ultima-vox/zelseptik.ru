name: Publish reviewed card layout and form routing on dev
on:
  push:
    branches: [chore/seo-dev-2026-10-06]
    paths: [.github/workflows/city-seo.yml]
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate routing without sending mail
        run: |
          php -l templates/template1/template.htm
          php tests/test-lead-routing.php
          node --check templates/template1/script.js
          node tests/test-lead-routing.cjs
      - name: Deploy reviewed card layout and form routing
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
        run: python3 scripts/deploy-dev-card-forms.py

# Reviewed equal card heights, unbroken measurements and explicit lead routing.
