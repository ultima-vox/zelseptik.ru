name: Publish compact HostCMS drain filter on dev
on:
  push:
    branches: [chore/seo-dev-2026-10-06]
    paths: [.github/workflows/city-seo.yml]
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate routing without sending mail
        run: |
          php -l templates/template1/template.htm
          php tests/test-lead-routing.php
          node --check templates/template1/script.js
          node tests/test-lead-routing.cjs
          node tests/test-drain-select.cjs
      - name: Deploy reviewed native HostCMS catalog filter
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
        run: python3 scripts/deploy-dev-drain-select.py

# Existing HostCMS shop 1: numeric ranges and drain properties.
# Guard uses exact CRLF bytes emitted by the CMS editor.
# Single drain dropdown and scrollable desktop sidebar.
