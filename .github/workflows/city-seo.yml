name: Publish reviewed city SEO on isolated dev
on:
  push:
    branches: [chore/seo-dev-2026-10-06]
    paths: [.github/workflows/city-seo.yml]
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Deploy reviewed native city text renderer
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
        run: python3 scripts/deploy-dev-city-seo.py

# Extend the reviewed native text renderer to all 13 main city landings.
