name: Inspect dev SEO structure (read only)
on:
  push:
    branches: [chore/seo-dev-2026-10-06]
    paths: [.github/workflows/inspect-dev-seo.yml]
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Inspect selected source and hashes without FTP writes
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
        run: python3 scripts/inspect-dev-seo.py
