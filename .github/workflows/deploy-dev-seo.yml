name: Deploy technical SEO to isolated dev
on:
  push:
    branches: [chore/seo-dev-2026-10-06]
    paths: [.github/workflows/deploy-dev-seo.yml]
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c1652fa47926e99b6ffa664d72f04c8819e0a900
          path: seo-source
          persist-credentials: false
      - name: Verify source archives and PHP syntax
        run: |
          python3 seo-source/scripts/verify-baseline.py
          php -l seo-source/templates/template13/template.htm
          php -l seo-source/hostcmsfiles/lib/lib_29/lib_config_29.php
          python3 seo-source/tests/sitemap-handler.py
      - name: Test drift protection, backup order and rollback
        run: python3 scripts/test-deploy-dev-seo.py
      - name: Deploy two reviewed files and verify public XML and headings
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
        run: python3 scripts/deploy-dev-seo.py --source seo-source --mode deploy
