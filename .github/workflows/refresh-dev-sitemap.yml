name: Refresh isolated dev sitemap cache
on:
  push:
    branches: [chore/seo-dev-2026-10-06]
    paths: [.github/workflows/refresh-dev-sitemap.yml]
permissions:
  contents: read
concurrency:
  group: dev-ftp
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify backup and failure recovery
        run: python3 tests/test-refresh-dev-sitemap.py
      - name: Refresh exact generated dev index and verify all URLs
        env:
          DEV_FTP_PASSWORD: ${{ secrets.DEV_FTP_PASSWORD }}
        run: python3 scripts/refresh-dev-sitemap.py
