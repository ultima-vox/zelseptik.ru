<!--
  JSON-LD: FAQPage
  Вставлять на страницах, где физически присутствует блок faq-section.

  Правило поисковиков: разметка обязана 1-в-1 повторять видимый на странице
  текст. Вопросов в разметке не должно быть больше, чем в вёрстке.
  Первые 3 вопроса взяты с dev-главной (там их сейчас 4, на старом сайте было 6).
  4-й вопрос — про стоимость монтажа — на странице ПОКА ОТСУТСТВУЕТ.
  Либо добавить его в faq-section вёрстки, либо удалить из этой разметки.
  При изменении FAQ в HostCMS разметку выводить тем же циклом, а не вручную.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Как правильно выбрать септик?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Выбор станции определяют три параметра: количество постоянно проживающих, тип грунта на участке и уровень грунтовых вод. От числа жильцов зависит производительность, от грунта и УГВ — способ отвода очищенной воды: самотёком или принудительно, насосом. Точный подбор делает инженер на бесплатном замере."
      }
    },
    {
      "@type": "Question",
      "name": "Есть ли у вас септики для высоких грунтовых вод?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Да. При высоком УГВ ставим герметичную станцию с насосной камерой, выполняем якорение корпуса и обсыпку цементно-песчаной смесью. Уровень грунтовых вод определяет способ отвода воды, поэтому он замеряется бурением до начала работ."
      }
    },
    {
      "@type": "Question",
      "name": "Какая гарантия на работы и оборудование?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Гарантия завода на оборудование — от 1 года. Гарантия на монтажные работы по договору — от 1 до 2 лет. Все условия фиксируются в договоре и гарантийном талоне, который выдаётся при сдаче объекта по акту."
      }
    },
    {
      "@type": "Question",
      "name": "Сколько стоит монтаж септика под ключ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Монтаж станции на 2–3 человека — от 24 000 ₽, на 4–5 человек — от 28 000 ₽, на 6–8 человек — от 32 000 ₽. В стоимость входит разработка котлована, установка и обсыпка станции, подключение трубопровода и пусконаладка. Смета фиксируется договором и не меняется в процессе работ."
      }
    }
  ]
}
</script>
