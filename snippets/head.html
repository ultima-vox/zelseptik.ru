<!--
  ПРАВКИ <head>
  Устраняют находки аудита. Применять в шаблоне HostCMS.
  Каждая правка снабжена пояснением, что именно она чинит.
-->

<!-- ==========================================================================
     1. CANONICAL — сейчас отсутствует на dev (на старом сайте есть)
     Без него dev-копия и основной сайт конкурируют как дубли.
     Значение подставлять из текущего URL страницы, домен всегда боевой.
     ========================================================================== -->
<link rel="canonical" href="https://zelseptik.ru/" />

<!-- ==========================================================================
     2. ЗАКРЫТЬ DEV ОТ ИНДЕКСАЦИИ — КРИТИЧНО

     Сейчас на dev.zelseptik.ru:
       meta robots  = index, follow
       robots.txt   = Allow: *
     То есть staging индексируется и дублирует боевой сайт.

     В шаблоне выводить noindex по условию хоста, например:
       <?php if ($_SERVER['HTTP_HOST'] !== 'zelseptik.ru'): ?>
         <meta name="robots" content="noindex, nofollow" />
       <?php else: ?>
         <meta name="robots" content="index, follow" />
       <?php endif; ?>

     Дополнительно закрыть dev на уровне сервера:
       - отдельный robots.txt для dev с "Disallow: /"
       - HTTP-заголовок X-Robots-Tag: noindex
       - basic-auth на весь хост (самый надёжный вариант)
     ========================================================================== -->
<meta name="robots" content="noindex, nofollow" />

<!-- ==========================================================================
     3. TITLE / DESCRIPTION — рассинхрон с контентом

     Сейчас:  «... под ключ в Москве.»
     Контент: «Зеленоград и МО», гео-блок, кейсы по Истре и Солнечногорску.

     Также в description опечатка в названии компании: «ЗелСетик» → «ЗЕЛСЕПТИК».
     ========================================================================== -->
<title>Септик под ключ в Зеленограде и МО — монтаж за 1 день | ЗЕЛСЕПТИК</title>
<meta name="description"
      content="Септики под ключ для дома и дачи в Зеленограде и Московской области. Официальный дилер ТОПАС, АСТРА, ЭКО-ГРАНД. Бесплатный замер, монтаж за 1 день, гарантия 5 лет по договору." />

<!-- ==========================================================================
     4. OPEN GRAPH — og:image сейчас указывает на logo.svg.
     SVG не рендерится ни одной соцсетью и мессенджером.
     Нужен растровый файл 1200×630 px, PNG или JPG, абсолютным URL.
     ========================================================================== -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ЗЕЛСЕПТИК" />
<meta property="og:locale" content="ru_RU" />
<meta property="og:title" content="Септик под ключ в Зеленограде и МО — монтаж за 1 день" />
<meta property="og:description"
      content="Официальный дилер ТОПАС, АСТРА, ЭКО-ГРАНД. Бесплатный замер, монтаж за 1 день, гарантия 5 лет." />
<meta property="og:url" content="https://zelseptik.ru/" />
<meta property="og:image" content="https://zelseptik.ru/assets/images/og-cover.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />

<!-- ==========================================================================
     5. LCP — preload фонового изображения hero.
     Сейчас preload нет ни одного, hero-фон грузится после всего CSS.
     ========================================================================== -->
<link rel="preload" as="image" href="/assets/images/hero-engineering-bg.jpg"
      fetchpriority="high" />

<!-- ==========================================================================
     6. ШРИФТЫ — сейчас грузятся 3 семейства (Inter, Onest, Unbounded),
     суммарно ~14 начертаний, блокирующей ссылкой.

     Минимум: оставить нужные веса и добавить preload на основной файл.
     Лучше: самохостинг woff2 + font-display: swap — снимает зависимость от
     fonts.googleapis.com и один лишний DNS+TLS-хендшейк.
     ========================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

     7. УБРАТЬ ПУСТЫЕ ФАЙЛЫ
